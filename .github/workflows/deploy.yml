name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Copy data into the static bundle
        run: |
          mkdir -p frontend/public/data
          cp data/intersections.geojson frontend/public/data/
          cp data/summary.json frontend/public/data/
          if [ -f data/imagery_scores.json ]; then
            cp data/imagery_scores.json frontend/public/data/
          fi
          ls -lh frontend/public/data/

      - name: Build static site
        working-directory: frontend
        env:
          NEXT_OUTPUT: export
          # Project sites live at /<repo>/. Set to "" for a user site or
          # a custom domain served from the root.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build
          # GitHub Pages runs Jekyll by default, which silently drops any
          # directory starting with an underscore — including Next's _next/.
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
